<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Kelompok 8 - Minggu 2 (Scene v1)</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- ===== PENCAHAYAAN ===== -->
  <!-- Ambient: cahaya merata agar sisi gelap tidak hitam pekat -->
  <a-light id="lampu-ambient" type="ambient" color="#ffffff" intensity="0.6"></a-light>
  <!-- Directional: cahaya searah seperti matahari, membentuk sisi terang/gelap -->
  <a-light id="lampu-directional" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

  <!-- ===== SCENE UTAMA (menempel pada marker Hiro) ===== -->
  <a-marker id="marker-hiro" preset="hiro">

    <!-- Alas: bidang datar, diputar -90 derajat agar rebah di atas marker -->
    <a-plane id="alas" position="0 0 0" rotation="-90 0 0" width="2" height="2"
             color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>

    <!-- Kelompok objek: geser/ubah skala induk akan memengaruhi semua anak sekaligus -->
    <a-entity id="kelompok-objek" position="0 0 0" scale="1 1 1">

      <!-- Objek 1: kubus (warna solid) -->
      <a-box id="kubus-biru" position="-0.6 0.25 0" width="0.5" height="0.5" depth="0.5"
             color="#4C6EF5"></a-box>

      <!-- Objek 2: bola (material: metalness & roughness) -->
      <a-sphere id="bola-oranye" position="0 0.3 0" radius="0.3"
                color="#D9531E" metalness="0.3" roughness="0.4"></a-sphere>

      <!-- Objek 3: silinder dengan animasi rotasi terus-menerus pada sumbu Y -->
      <a-cylinder id="silinder-hijau" position="0.6 0.3 0" radius="0.2" height="0.6" color="#0B7F73"
                  animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
      </a-cylinder>

    </a-entity>

    <!-- Objek 4: kotak bertekstur (gambar dari folder assets) -->
    <a-box id="kotak-tekstur" position="0 0.15 0.7" width="0.5" height="0.3" depth="0.5"
           src="assets/tekstur.jpg"></a-box>

  </a-marker>

  <!-- Kamera -->
  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
